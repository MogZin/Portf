<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VF SHOES Admin | Cadastro de Produtos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0b0b0b; --card:#171717; --line:rgba(255,255,255,.12); --txt:#f0f0f0; --muted:#a9a9a9; }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--txt);padding:24px}
    .wrap{max-width:1100px;margin:auto;display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
    h1{font-size:1.6rem;margin-bottom:8px}
    .muted{color:var(--muted);font-size:.9rem}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    label{font-size:.86rem;color:var(--muted)}
    input,textarea,select{width:100%;padding:10px;border-radius:8px;background:#101010;border:1px solid var(--line);color:var(--txt);margin-top:4px}
    textarea{min-height:82px;resize:vertical}
    .btn{border:1px solid var(--line);background:#2a2a2a;color:var(--txt);padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:700}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    table{width:100%;border-collapse:collapse;margin-top:8px}
    th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem}
    @media (max-width:920px){.wrap{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <h1>Painel de Produtos - VF SHOES</h1>
      <p class="muted">Cadastre e atualize produtos. O catálogo da página principal (index.html) lê estes dados automaticamente via localStorage.</p>

      <div class="grid" style="margin-top:12px">
        <div><label>Marca<input id="brand" placeholder="Nike"></label></div>
        <div><label>Nome do modelo<input id="name" placeholder="Air Max 270"></label></div>
        <div><label>Preço (R$)<input id="price" type="number" step="0.01" placeholder="649.90"></label></div>
        <div><label>Categoria<input id="category" placeholder="Corrida"></label></div>
        <div><label>Gênero<select id="gender"><option>Unissex</option><option>Masculino</option><option>Feminino</option></select></label></div>
        <div><label>Tipo de uso<input id="use" placeholder="Treino"></label></div>
        <div><label>Cor<input id="color" placeholder="Preto/Branco"></label></div>
        <div><label>Estoque<input id="stock" type="number" placeholder="12"></label></div>
        <div><label>Badge<input id="badge" placeholder="Lançamento"></label></div>
        <div><label>Tamanhos disponíveis (ex: 37,38,39)<input id="sizes" placeholder="37,38,39,40"></label></div>
      </div>

      <div style="margin-top:8px">
        <label>Detalhes<textarea id="details" placeholder="Tecnologia, material, benefício..."></textarea></label>
      </div>
      <div style="margin-top:8px">
        <label>Imagens (URLs separadas por vírgula)<textarea id="images" placeholder="https://...jpg, https://...jpg"></textarea></label>
      </div>

      <div class="actions">
        <button class="btn" onclick="addProduct()">Adicionar produto</button>
        <button class="btn" onclick="clearForm()">Limpar formulário</button>
        <button class="btn" onclick="resetDefaults()">Restaurar catálogo padrão</button>
        <button class="btn" onclick="goStore()">Abrir loja</button>
      </div>
    </section>

    <section class="card">
      <h2>Produtos cadastrados</h2>
      <p class="muted">Você pode remover itens individualmente.</p>
      <table>
        <thead><tr><th>Modelo</th><th>Preço</th><th>Tamanhos</th><th>Ação</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </div>

  <script>
    const DEFAULT_PRODUCTS = [
      { id: 1, brand:'Nike', name:'Air Max 270', price:649.9, category:'Corrida', gender:'Unissex', use:'Treino', color:'Preto/Branco', stock:12, badge:'Em Alta', details:'Amortecimento Air Max e estilo urbano.', sizes:[37,38,39,40,41,42], images:['https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1200&auto=format&fit=crop','https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=1200&auto=format&fit=crop','https://images.unsplash.com/photo-1605348532760-6753d2c43329?q=80&w=1200&auto=format&fit=crop'] },
      { id: 2, brand:'Adidas', name:'Ultraboost 22', price:799.9, category:'Corrida', gender:'Feminino', use:'Competição', color:'Branco', stock:7, badge:'Lançamento', details:'Resposta de energia e conforto premium.', sizes:[37,38,39,40,41,42], images:['https://images.unsplash.com/photo-1597248881519-db089d3744a5?q=80&w=1200&auto=format&fit=crop','https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?q=80&w=1200&auto=format&fit=crop','https://images.unsplash.com/photo-1600180758895-9e8ef6a2dbe4?q=80&w=1200&auto=format&fit=crop'] },
      { id: 3, brand:'Vans', name:'Old Skool Pro', price:389.9, category:'Skate', gender:'Unissex', use:'Skate', color:'Preto', stock:11, badge:'Clássico', details:'Durável para skate e versátil para o dia a dia.', sizes:[36,37,38,39,40,41,42], images:['https://images.unsplash.com/photo-1560769629-975ec94e6a86?q=80&w=1200&auto=format&fit=crop','https://images.unsplash.com/photo-1584735175097-719d848f8449?q=80&w=1200&auto=format&fit=crop','https://images.unsplash.com/photo-1575537302964-96cd47c06b1b?q=80&w=1200&auto=format&fit=crop'] }
    ];

    let products = JSON.parse(localStorage.getItem('vf_products_custom') || 'null') || [...DEFAULT_PRODUCTS];
    const byId = (id) => document.getElementById(id);
    const money = (v) => `R$ ${Number(v).toFixed(2).replace('.', ',')}`;

    function persist() {
      localStorage.setItem('vf_products_custom', JSON.stringify(products));
      renderRows();
    }

    function renderRows() {
      byId('rows').innerHTML = products.map((p) => `
        <tr>
          <td>${p.brand} ${p.name}</td>
          <td>${money(p.price)}</td>
          <td>${(p.sizes || []).join(', ')}</td>
          <td><button class="btn" onclick="removeProduct(${p.id})">Remover</button></td>
        </tr>
      `).join('');
    }

    function getVal(id) { return byId(id).value.trim(); }

    function addProduct() {
      const brand = getVal('brand');
      const name = getVal('name');
      const price = Number(getVal('price'));
      const category = getVal('category');
      const gender = getVal('gender');
      const use = getVal('use');
      const color = getVal('color');
      const stock = Number(getVal('stock') || 0);
      const badge = getVal('badge') || 'Novo';
      const details = getVal('details');
      const sizes = getVal('sizes').split(',').map((n) => Number(n.trim())).filter(Boolean);
      const images = getVal('images').split(',').map((u) => u.trim()).filter(Boolean);

      if (!brand || !name || !price || !category || !sizes.length || !images.length) {
        alert('Preencha pelo menos: marca, nome, preço, categoria, tamanhos e imagens.');
        return;
      }

      const id = products.length ? Math.max(...products.map((p) => p.id)) + 1 : 1;
      products.push({ id, brand, name, price, category, gender, use, color, stock, badge, details, sizes, images });
      persist();
      clearForm();
      alert('Produto adicionado! Abra a loja para conferir.');
    }

    function removeProduct(id) {
      products = products.filter((p) => p.id !== id);
      persist();
    }

    function clearForm() {
      ['brand','name','price','category','use','color','stock','badge','sizes','details','images'].forEach((id) => byId(id).value = '');
      byId('gender').value = 'Unissex';
    }

    function resetDefaults() {
      if (!confirm('Restaurar catálogo padrão?')) return;
      products = [...DEFAULT_PRODUCTS];
      persist();
    }

    function goStore() { location.href = 'index.html'; }

    renderRows();
  </script>
</body>
</html>
