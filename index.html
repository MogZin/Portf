<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VF SHOES — Premium Sneakers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <a href="#" class="logo">VF<span>.</span>SHOES</a>
    <div class="top-actions">
      <button id="theme-toggle" class="btn ghost" type="button">🌙 Tema</button>
      <button id="scroll-top" class="btn ghost" type="button" aria-label="Voltar ao topo">↑ Topo</button>
    </div>
  </header>

  <main class="container">
    <section class="card hero">
      <h1>Sneakers Premium</h1>
      <p>Catálogo com filtros avançados, ordenação, tags, parcelas, lightbox, microinterações e modo escuro/claro.</p>
    </section>

    <section class="card controls">
      <h2>Filtros e Ordenação</h2>
      <div class="controls-grid">
        <label>Categoria<select id="filter-category"></select></label>
        <label>Marca<select id="filter-brand"></select></label>
        <label>Tag<select id="filter-tag"></select></label>
        <label>Tamanho<select id="filter-size"></select></label>
        <label>Avaliação<select id="filter-rating"></select></label>
        <label>Preço máximo
          <input id="filter-price" type="range" min="200" max="1400" value="1400" step="50" />
          <small id="price-value"></small>
        </label>
        <label>Ordenar<select id="sort-by">
          <option value="recent">Mais recentes</option>
          <option value="price-asc">Menor preço</option>
          <option value="price-desc">Maior preço</option>
          <option value="rating-desc">Mais avaliados</option>
        </select></label>
      </div>
    </section>

    <section id="catalog-view">
      <div id="products-grid" class="products-grid"></div>
      <div id="no-results" class="card hidden">Nenhum produto encontrado.</div>
    </section>

    <section id="product-view" class="hidden"></section>

    <section class="card">
      <h2>Admin (MVP local)</h2>
      <p>Atualize o estoque abaixo (simulação de backend com localStorage).</p>
      <div id="admin-list"></div>
    </section>
  </main>

  <div id="lightbox" class="lightbox hidden">
    <button id="lightbox-close" class="btn">Fechar</button>
    <img id="lightbox-image" alt="Imagem ampliada" />
  </div>

  <script src="script.js"></script>
</body>
</html>
