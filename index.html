<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VF SHOES — Catálogo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="header">
    <a class="logo" href="index.html">VF<span>.</span>SHOES</a>
    <nav class="top-actions">
      <a class="btn ghost" href="admin.html">Admin</a>
      <button class="btn ghost" id="theme-toggle" type="button">🌙 Tema</button>
    </nav>
  </header>

  <main class="container">
    <section class="hero card">
      <h1>Catálogo Premium</h1>
      <p>Filtros avançados, ordenação, tags e experiência refinada para e-commerce.</p>
    </section>

    <section class="controls card">
      <h2>Filtros & Ordenação</h2>
      <div class="grid controls-grid">
        <label>Categoria
          <select id="filter-category"></select>
        </label>
        <label>Marca
          <select id="filter-brand"></select>
        </label>
        <label>Tag
          <select id="filter-tag"></select>
        </label>
        <label>Tamanho disponível
          <select id="filter-size"></select>
        </label>
        <label>Avaliação mínima
          <select id="filter-rating"></select>
        </label>
        <label>Preço máximo
          <input type="range" id="filter-price" min="200" max="1400" step="50" value="1400">
          <small id="price-value"></small>
        </label>
        <label>Ordenar por
          <select id="sort-by">
            <option value="recent">Mais recentes</option>
            <option value="price-asc">Menor preço</option>
            <option value="price-desc">Maior preço</option>
            <option value="rating-desc">Mais avaliados</option>
          </select>
        </label>
      </div>
    </section>

    <section class="products-section">
      <div id="products-grid" class="products-grid"></div>
      <div id="no-results" class="card hidden">Nenhum produto encontrado com os filtros atuais.</div>
    </section>
  </main>

  <button id="scroll-top" class="scroll-top" aria-label="Voltar ao topo">↑</button>

  <script type="module" src="js/app.js"></script>
</body>
</html>
